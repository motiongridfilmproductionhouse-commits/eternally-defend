app = "eterna-crawler"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CRAWL_MAX_CONCURRENCY = "6"
  CRAWL_PAGE_TIMEOUT_MS = "10000"
  CRAWL_HARD_TIMEOUT_S = "13"
  CRAWL_QUEUE_WAIT_TIMEOUT_S = "20"
  CRAWL_BREAKER_THRESHOLD = "8"
  CRAWL_BREAKER_OPEN_SECONDS = "60"
  CRAWL_MAX_PAGES_BEFORE_RECYCLE = "200"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep Chromium warm: never stop, always one machine running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 12

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

# Chromium needs ~500MB/tab at concurrency 6, plus 1GB /dev/shm.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
